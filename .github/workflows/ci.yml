name: ci
on: [push, pull_request]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n build-qemu-esp32s3.sh && bash -n run-qemu-esp32s3.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning build-qemu-esp32s3.sh run-qemu-esp32s3.sh
